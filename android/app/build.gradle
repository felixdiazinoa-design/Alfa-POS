apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
def allowReleaseCleartext = providers.gradleProperty('clicPosAllowReleaseCleartext')
        .orElse('false')
        .get()
        .toBoolean()

if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.clicpos.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.alfapos.app"
        buildConfigField "boolean", "POS_DIAGNOSTICS", System.getenv("CLIC_POS_DIAGNOSTICS") == "true" ? "true" : "false"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1412
        versionName "1.1.412"
        manifestPlaceholders = [
                usesCleartextTraffic: "true",
                diagnosticProfileable: System.getenv("CLIC_POS_DIAGNOSTICS") == "true" ? "true" : "false",
                networkSecurityConfig: "@xml/network_security_config"
        ]
        buildConfigField "boolean", "ALLOW_CLEARTEXT_WEBVIEW", "true"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            manifestPlaceholders = [
                    usesCleartextTraffic: allowReleaseCleartext ? "true" : "false",
                    networkSecurityConfig: allowReleaseCleartext
                            ? "@xml/network_security_config"
                            : "@xml/network_security_config_strict"
            ]
            buildConfigField "boolean", "ALLOW_CLEARTEXT_WEBVIEW", allowReleaseCleartext ? "true" : "false"
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    packagingOptions {
        resources {
            excludes += ['build-data.properties']
        }
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    sourceSets {
        main {
            java.srcDirs += ['../../native-stubs/android']
        }
    }
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach { output ->
        def apkBaseName = 'Alfa-Pos'
        def apkVersionName = variant.versionName ?: '1.0'
        def apkBuildType = variant.buildType.name
        output.outputFileName = "${apkBaseName}-${apkVersionName}-${apkBuildType}.apk"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlin_version}"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "com.machinezoo.sourceafis:sourceafis:3.18.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
