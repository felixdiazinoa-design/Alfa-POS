apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
def allowReleaseCleartext = providers.gradleProperty('clicPosAllowReleaseCleartext')
        .orElse('false')
        .get()
        .toBoolean()

if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.clicpos.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.clicpos.app"
        buildConfigField "boolean", "POS_DIAGNOSTICS", System.getenv("CLIC_POS_DIAGNOSTICS") == "true" ? "true" : "false"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1402
        versionName "1.1.402"
        manifestPlaceholders = [
                usesCleartextTraffic: "true",
                diagnosticProfileable: System.getenv("CLIC_POS_DIAGNOSTICS") == "true" ? "true" : "false",
                networkSecurityConfig: "@xml/network_security_config"
        ]
        buildConfigField "boolean", "ALLOW_CLEARTEXT_WEBVIEW", "true"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            manifestPlaceholders = [
                    usesCleartextTraffic: allowReleaseCleartext ? "true" : "false",
                    networkSecurityConfig: allowReleaseCleartext
                            ? "@xml/network_security_config"
                            : "@xml/network_security_config_strict"
            ]
            buildConfigField "boolean", "ALLOW_CLEARTEXT_WEBVIEW", allowReleaseCleartext ? "true" : "false"
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    packagingOptions {
        resources {
            excludes += ['build-data.properties']
        }
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    sourceSets {
        main {
            java.srcDirs += ['../../native-stubs/android']
        }
    }
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach { output ->
        def apkBaseName = 'Clic-Pos'
        def apkVersionName = variant.versionName ?: '1.0'
        def apkBuildType = variant.buildType.name
        output.outputFileName = "${apkBaseName}-${apkVersionName}-${apkBuildType}.apk"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlin_version}"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "com.machinezoo.sourceafis:sourceafis:3.18.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// --- Entregables APK dentro del repositorio ---
// Cada compilación copia su APK a <repo>/APK, así el instalable queda dentro de la
// carpeta del proyecto y no solo en android/app/build (que Gradle limpia).
// Los release sin keystore van a APK/unsigned/ para que nunca se confundan con un
// instalable (Genymotion rechaza APK sin firma con "error while deploying the file").
// El nombre del APK ya lo define el bloque applicationVariants de arriba:
// Clic-Pos-<versionName>-<buildType>.apk
def apkDeliverablesDir = rootProject.file('../APK')
def apkUnsignedDir = rootProject.file('../APK/unsigned')

tasks.register('collectApks') {
    group = 'distribution'
    description = 'Copia los APK compilados a <repo>/APK junto con su checksum SHA-256.'

    doLast {
        def failedTask = gradle.taskGraph.allTasks.find { it.state.failure != null }
        if (failedTask != null) {
            logger.lifecycle("[apk] La compilación falló en ${failedTask.path}; no se copian APK.")
            return
        }

        def outputRoot = layout.buildDirectory.dir('outputs/apk').get().asFile
        if (!outputRoot.exists()) {
            logger.lifecycle('[apk] Todavía no hay APK compilados en app/build/outputs/apk.')
            return
        }

        apkDeliverablesDir.mkdirs()

        // Sin key.properties el APK release sale sin firmar: se aparta en APK/unsigned/.
        def hasSigningMaterial = rootProject.file('key.properties').exists()

        // Solo la versión de esta compilación: build/outputs conserva APK de builds
        // anteriores y copiarlos todos reeditaba releases viejos cada vez.
        def currentVersionName = android.defaultConfig.versionName?.toString()
        def copied = []
        outputRoot.eachFileRecurse { apk ->
            if (!apk.isFile() || !apk.name.endsWith('.apk')) {
                return
            }
            if (currentVersionName && !apk.name.contains("-${currentVersionName}-")) {
                return
            }

            def unsigned = !hasSigningMaterial && apk.name.contains('-release')
            def destination = unsigned ? apkUnsignedDir : apkDeliverablesDir
            if (unsigned) {
                destination.mkdirs()
                logger.lifecycle('[apk] Aviso: no hay android/key.properties; el APK release va a APK/unsigned y NO es instalable.')
            }

            def bytes = apk.bytes
            def target = new File(destination, apk.name)
            target.bytes = bytes

            def digest = java.security.MessageDigest.getInstance('SHA-256')
            digest.update(bytes)
            new File(destination, "${apk.name}.sha256").text =
                "${digest.digest().encodeHex().toString()}  ${apk.name}\n"

            copied << "${unsigned ? 'unsigned/' : ''}${apk.name}"
            logger.lifecycle("[apk] ${unsigned ? 'unsigned/' : ''}${apk.name} -> ${target}")
        }

        if (copied.isEmpty()) {
            logger.lifecycle('[apk] No se encontraron APK para copiar.')
        } else {
            logger.lifecycle("[apk] ${copied.size()} APK disponible(s) en ${apkDeliverablesDir}")
        }
    }
}

tasks.matching { it.name == 'assembleDebug' || it.name == 'assembleRelease' }.configureEach {
    finalizedBy('collectApks')
}
